<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Credsey Admin</title>
<link rel="icon" type="image/png" href="/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
<link rel="stylesheet" href="/admin/admin.css?v=2">
</head><body>
<div id="login" class="login" hidden>
  <form class="login-card" id="login-form">
    <img src="/img/credsey-logo-hdr.webp" alt="Credsey" width="900" height="308">
    <h1>Admin portal</h1>
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <label class="show-pw"><input type="checkbox" id="show-pw"> Show password</label>
    <button class="btn" type="submit">Sign in</button>
    <p class="msg" role="alert"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <a class="side-logo" href="/" target="_blank" rel="noopener"><img src="/img/credsey-logo-white.png" alt="Credsey" width="900" height="448"></a>
    <nav id="menu">
      <a href="#dashboard" data-area="*">Dashboard</a>
      <a href="#leads" data-area="leads">Leads <b id="lead-badge" hidden></b></a>
      <a href="#blog" data-area="blog">Blog</a>
      <a href="#content" data-area="content">Website content</a>
      <a href="#team" data-area="users">Team</a>
      <a href="#account" data-area="*">My account</a>
    </nav>
    <div class="side-foot"><span id="who"></span><button class="link" id="logout" type="button">Sign out</button></div>
  </aside>
  <main class="main" id="view"></main>
  <button class="menu-btn" id="menu-btn" type="button" aria-label="Menu">☰</button>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="/admin/admin.js?v=2"></script>
</body></html>
